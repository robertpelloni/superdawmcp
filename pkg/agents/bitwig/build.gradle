plugins {
    id 'java'
}

// Fixed versioning logic: read from VERSION.md at root
def versionFile = file('../../../VERSION.md')
version = versionFile.exists() ? versionFile.text.trim() : '1.0.0'

group = 'com.pxaudio'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.bitwig.com'
    }
}

dependencies {
    compileOnly 'com.bitwig:extension-api:18'
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    archiveBaseName = 'superdaw-bitwig'
    archiveExtension = 'bwextension'

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes(
            'Extension-Class': 'com.pxaudio.bitwigmcp.BitwigMCPExtensionDefinition'
        )
    }
}

task copyExtension(type: Copy) {
    dependsOn jar
    from jar.outputs.files
    into System.getProperty('user.home') + '/Bitwig Studio/Extensions'
}
